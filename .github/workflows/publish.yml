name: Publish crate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crates-io-publish
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'mendrik-private/asset-scaler' && github.actor == 'mendrik-private' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Match tag to Cargo version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo package --locked
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - uses: rust-lang/crates-io-auth-action@v1
        if: env.BOOTSTRAP_TOKEN == ''
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
